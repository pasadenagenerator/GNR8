services:
  airship-builder-worker:
    build:
      context: ../../../..
      dockerfile: apps/airship-builder-worker/Dockerfile
      args:
        AIRSHIP_CLI_VERSION: ${GNR8_AIRSHIP_CLI_VERSION:?Set a pinned Airship CLI version}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3002}:3002"
    volumes:
      - airship-builder-sessions:/srv/gnr8-airship/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  airship-builder-sessions:
